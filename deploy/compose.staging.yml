# Staging (compose project `acme-staging`) — SRS ENV-2. Hanya menyala saat UAT; data DUMMY.
# Tak ada cloudflared sendiri: tunnel produksi merutekan erp-staging.<domain> ke
# acme-staging-proxy lewat jaringan `acme_edge` (dibuat compose.prod.yml -> naikkan produksi dulu).
#   docker compose -f deploy/compose.staging.yml --env-file .env.staging up -d
# Migrasi: sama seperti produksi, dengan -f compose.staging.yml dan MIGRATE_DATABASE_URL staging.

name: acme-staging

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?wajib}
      POSTGRES_DB: acme
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?wajib}
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?wajib}
    volumes:
      - staging_db_data:/var/lib/postgresql/data
      - ./db/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
      - ./db/roles.sql:/db/roles.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acme"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${GHCR_OWNER:?isi <owner>}/acme-api:${IMAGE_TAG:?wajib}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *logging
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://acme_app:${APP_DB_PASSWORD}@db:5432/acme?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?wajib}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?wajib}
      NODE_ENV: production
      APP_ENV: staging
      NODE_OPTIONS: --max-old-space-size=192
      PORT: "3001"
      UPLOADS_DIR: /app/uploads
      AUDIT_TRUSTED_PROXY_IPS: 172.30.2.10
    volumes:
      - staging_uploads:/app/uploads
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  proxy:
    image: ghcr.io/${GHCR_OWNER}/acme-proxy-staging:${IMAGE_TAG}
    # Hanya dipakai CI (`docker compose build proxy`); VPS tidak build (INF-6).
    build:
      context: ..
      dockerfile: deploy/proxy/Dockerfile
      args:
        APP_ENV: staging
        APP_VERSION: ${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    logging: *logging
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.prod", "--adapter", "caddyfile"]
    depends_on:
      api: { condition: service_healthy }
    environment:
      CLOUDFLARED_IP: 172.30.1.10
    volumes:
      - staging_uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal:
        ipv4_address: 172.30.2.10
      edge:
        aliases: [acme-staging-proxy]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  internal:
    name: acme_staging_internal
    ipam: { config: [{ subnet: 172.30.2.0/24, ip_range: 172.30.2.128/25 }] }
  edge:
    name: acme_edge
    external: true

volumes:
  staging_db_data:
  staging_uploads:
  caddy_data:
  caddy_config:
